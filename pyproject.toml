[project]
name = "arenawealth"
version = "0.1.0"
description = "Professional wealth management platform for international investors"
readme = "README.md"
requires-python = ">=3.11"
license = "BUSL-1.1"
authors = [{ name = "Sidnei Barbieri" }]

dependencies = [
    "pydantic>=2.11",
    "httpx>=0.28",
    "yfinance>=0.2",
    "polars>=1.0",
    "python-dotenv>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "mypy>=1.15",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]
quant = [
    "cvxpy>=1.6",
    "scipy>=1.15",
    "quantstats>=0.0.64",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arenawealth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests requiring network or real API keys",
]

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "SIM",         # simplify
    "RUF",         # ruff-specific
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
